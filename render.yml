services:
  - type: web
    name: munch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: munch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: university.edu
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: munch-db
    plan: free